        const calculateEndDate = (startDateStr, durationDays) => {
           if (!startDateStr || !durationDays) return '';
           const startDate = new Date(startDateStr);
           const days = parseInt(durationDays, 10);
           if (isNaN(days) || days < 1) return startDateStr;
           
           const currentDate = new Date(startDate);
           let addedDays = 0;
           
           while (addedDays < days - 1) {
               currentDate.setDate(currentDate.getDate() + 1);
               const dayOfWeek = currentDate.getDay();
               if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                   addedDays++;
               }
           }
           
           const yyyy = currentDate.getFullYear();
           const mm = String(currentDate.getMonth() + 1).padStart(2, '0');
           const dd = String(currentDate.getDate()).padStart(2, '0');
           return `${yyyy}-${mm}-${dd}`;
        };

        const formatDateForPrint = (dateStr) => {
           if (!dateStr) return '';
           const parts = dateStr.split('-');
           if (parts.length !== 3) return dateStr;
           
           // Use English month abbreviations to ensure formatting looks good and is robust
           const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
           const [y, m, d] = parts;
           const monthIndex = parseInt(m, 10) - 1;
           
           if (monthIndex >= 0 && monthIndex < 12) {
               return `${d} ${monthNames[monthIndex]} ${y}`;
           }
           
           return `${d}/${m}/${y}`; // Fallback if parsing fails
        };

        const recalculateTimelineNumbers = (timeline) => {
           // We need separate counters for Phase 1 and Phase 2
           let countersPhase1 = [0, 0, 0, 0, 0];
           let countersPhase2 = [0, 0, 0, 0, 0];

           return timeline.map(item => {
               const counters = item.phase === 2 ? countersPhase2 : countersPhase1;
               
               counters[item.lvl] = (counters[item.lvl] || 0) + 1;
               for (let i = item.lvl + 1; i < counters.length; i++) {
                   counters[i] = 0;
               }
               let newNo = '';
               if (item.lvl === 0) newNo = `${counters[0]}`;
               else if (item.lvl === 1) newNo = `${counters[0]}.${counters[1]}`;
               return { ...item, no: newNo };
           });
        };

          const handleSaveDraft = async (forceFinalVerify = false, isSilent = false, overrideValidatedPages = null, overrideFormData = null) => {
            if (!user || !db || !formId) { 
                if (!isSilent) showToast("Gagal menyimpan: Database terputus."); 
                return; 
            }
            if (!isSilent) setSaving(true);
            
            // Selalu tampilkan status walau proses terjadi di belakang layar
            setAutoSaveStatus('Menyimpan...');
            
            try {
              const docRef = db.doc(`qontak_urds/${formId}`);
              const finalStatus = forceFinalVerify === true ? true : isFinalVerified;
              
              let updatedHistory = formData.revisionHistory || [];
              const dataToSave = { 
                  ...(overrideFormData || formData), 
                  validatedPages: overrideValidatedPages || validatedPages, 
                  isFinalVerified: finalStatus 
              };

              // MENCEGAH BUG "ZOMBIE PIN": 
              // Selalu hapus unlockPin dari paket data klien yang akan disave agar Auto-Save tidak menghidupkan kembali PIN yang sudah hangus.
              delete dataToSave.unlockPin;

              // AUTO-TRACK LOGIC: Jika final verifikasi dilakukan, bandingkan dengan snapshot lama
              if (forceFinalVerify) {
                  const docSnap = await docRef.get();
                  if (docSnap.exists) {
                      const dbData = docSnap.data();
                      if (dbData.unlockSnapshot && dbData.pendingRevisionId) {
                          const oldData = JSON.parse(dbData.unlockSnapshot);
                          const changes = [];
                          
                          // Helper cerdas untuk menormalisasi data (menghapus undefined, null, dan string kosong)
                          // agar Firebase vs React State tidak menghasilkan false-positive
                          const normalize = (val) => {
                              if (Array.isArray(val)) return val.map(normalize);
                              if (val !== null && typeof val === 'object') {
                                  const out = {};
                                  Object.keys(val).sort().forEach(k => {
                                      if (val[k] !== '' && val[k] !== null && val[k] !== undefined) {
                                          out[k] = normalize(val[k]);
                                      }
                                  });
                                  return out;
                              }
                              return val;
                          };

                          const isDiff = (a, b) => JSON.stringify(normalize(a)) !== JSON.stringify(normalize(b));

                          // Helper untuk membandingkan obyek sederhana tingkat 1
                          const compareObj = (oldObj, newObj, moduleName, prefix = '') => {
                              const normOld = normalize(oldObj) || {};
                              const normNew = normalize(newObj) || {};
                              const keys = new Set([...Object.keys(normOld), ...Object.keys(normNew)]);
                              keys.forEach(key => {
                                  if (typeof normOld[key] !== 'object' && typeof normNew[key] !== 'object') {
                                      if (normOld[key] !== normNew[key]) {
                                          changes.push(`Halaman ${moduleName}: '${prefix}${key}' diubah dari '${normOld[key] || '-'}' menjadi '${normNew[key] || '-'}'`);
                                      }
                                  }
                              });
                          };

                          // 1. Team & General Info
                          compareObj(oldData.teamStructure, formData.teamStructure, 'Team Structure');
                          compareObj(oldData.generalInfo, formData.generalInfo, 'General Info');

                          // 2. Users
                          if (isDiff(oldData.registeredUsers, formData.registeredUsers)) changes.push(`Halaman Users: Data tabel pengguna Omnichannel diubah`);
                          if (isDiff(oldData.crmUsers, formData.crmUsers)) changes.push(`Halaman Users: Data tabel pengguna CRM diubah`);
                          if (isDiff(oldData.crmSimpleMatrix, formData.crmSimpleMatrix) || isDiff(oldData.crmAdvancedMatrix, formData.crmAdvancedMatrix)) {
                              changes.push(`Halaman Users: Hak akses / Matriks role CRM diubah`);
                          }

                          // 3. Call Center
                          compareObj(oldData.callCenter?.config, formData.callCenter?.config, 'Call Center', 'Config ');
                          if (isDiff(oldData.callCenter?.ivr, formData.callCenter?.ivr)) {
                              changes.push(`Halaman Call Center: Data alur IVR / Voice diubah`);
                          }
                          if (isDiff(oldData.callCenterUsers, formData.callCenterUsers)) {
                              changes.push(`Halaman Call Center: Data tabel pengguna Call Center diubah`);
                          }

                          // 4. Pengaturan Field (Company, Contact, dll)
                          const compareModuleDefaults = (oldArr, newArr, moduleName) => {
                              const normOld = normalize(oldArr) || [];
                              const normNew = normalize(newArr) || [];
                              normNew.forEach((newItem, index) => {
                                  const oldItem = normOld.find(o => o.id === newItem.id) || normOld[index];
                                  if (oldItem && oldItem.field) {
                                      const oldShow = oldItem.show || false;
                                      const newShow = newItem.show || false;
                                      const oldMandatory = oldItem.mandatory || false;
                                      const newMandatory = newItem.mandatory || false;
                                      
                                      if (oldShow !== newShow) changes.push(`Halaman ${moduleName}: Status Tampil '${newItem.field}' diubah dari '${oldShow ? 'Ya' : 'Tidak'}' menjadi '${newShow ? 'Ya' : 'Tidak'}'`);
                                      if (oldMandatory !== newMandatory) changes.push(`Halaman ${moduleName}: Status Wajib '${newItem.field}' diubah dari '${oldMandatory ? 'Ya' : 'Tidak'}' menjadi '${newMandatory ? 'Ya' : 'Tidak'}'`);
                                      if ((oldItem.options || '') !== (newItem.options || '')) changes.push(`Halaman ${moduleName}: Opsi '${newItem.field}' diubah dari '${oldItem.options || '-'}' menjadi '${newItem.options || '-'}'`);
                                  }
                              });
                          };
                          compareModuleDefaults(oldData.contactDefaults, formData.contactDefaults, 'Contact');
                          compareModuleDefaults(oldData.companyDefaults, formData.companyDefaults, 'Company');
                          compareModuleDefaults(oldData.dealsDefaults, formData.dealsDefaults, 'Deals');
                          compareModuleDefaults(oldData.ticketDefaults, formData.ticketDefaults, 'Ticket');
                          compareModuleDefaults(oldData.taskDefaults, formData.taskDefaults, 'Task');
                          compareModuleDefaults(oldData.productDefaults, formData.productDefaults, 'Product');

                          // 5. WhatsApp & Channel
                          compareObj(oldData.whatsappDetails, formData.whatsappDetails, 'WhatsApp');
                          if (isDiff(oldData.channels, formData.channels)) changes.push(`Halaman Channel: Status integrasi atau checkbox diubah`);
                          if (isDiff(oldData.ecommerce, formData.ecommerce)) changes.push(`Halaman E-Commerce: Status integrasi marketplace diubah`);

                          // 6. Complex Flow (Chatbot, WA Flow, Pipeline, Timeline)
                          if (isDiff(oldData.chatbots, formData.chatbots)) changes.push(`Halaman Chatbot: Alur FAQ atau struktur bot diubah`);
                          if (isDiff(oldData.pipelines, formData.pipelines)) changes.push(`Halaman Pipeline: Nama stage atau struktur pipeline diubah`);
                          if (isDiff(oldData.waFlow, formData.waFlow)) changes.push(`Halaman WA Flow: Teks komponen atau flow form diubah`);
                          if (isDiff(oldData.timeline, formData.timeline)) changes.push(`Halaman Timeline: Aktivitas, durasi, atau tanggal pengerjaan diubah`);
                          
                          const changeText = changes.length > 0 ? changes.map((c, i) => `${i + 1}. ${c}`).join('\n') : 'Tidak ada perubahan data spesifik yang terdeteksi secara otomatis.';
                          
                          // Update baris riwayat spesifik dengan hasil deteksi sistem
                          updatedHistory = updatedHistory.map(rev => 
                              rev.id === dbData.pendingRevisionId 
                                  ? { ...rev, autoTrack: changeText } 
                                  : rev
                          );
                          dataToSave.revisionHistory = updatedHistory;
                          dataToSave.unlockSnapshot = firebase.firestore.FieldValue.delete();
                          dataToSave.pendingRevisionId = firebase.firestore.FieldValue.delete();
                          setFormData(prev => ({ ...prev, revisionHistory: updatedHistory }));
                      }
                  }
              }
              
              // Menggunakan set dengan merge: true agar bisa Create (Buat Baru) dan Update sekaligus
              await docRef.set(dataToSave, { merge: true });
              
              setIsFinalVerified(finalStatus);
              if (!isSilent) showToast("✅ Data berhasil disimpan!");
              
              setAutoSaveStatus('Tersimpan ✅');
              setTimeout(() => {
                  setAutoSaveStatus(prev => prev === 'Tersimpan ✅' ? '' : prev);
              }, 3000);
            } catch (error) { 
              console.error("Save error:", error);
              if (!isSilent) showToast("❌ Gagal menyimpan data. Pastikan koneksi stabil."); 
              setAutoSaveStatus('Gagal menyimpan ❌');
            } finally { 
              if (!isSilent) setSaving(false); 
            }
          };

          const handleUnlockForm = async () => {
              try {
                  // Minta E-Form mengambil data TERBARU dari database saat tombol ditekan
                  const docRef = db.doc(`qontak_urds/${formId}`);
                  const docSnap = await docRef.get();

                              date: new Date().toLocaleString('id-ID', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' WIB',
                              reason: "Revisi Form URD"

                          // Update DB untuk mencabut status verified, menghapus PIN, menyimpan snapshot dan menambah riwayat
                          await docRef.update({
                              isFinalVerified: false,
                              unlockPin: firebase.firestore.FieldValue.delete(),
                              unlockSnapshot: JSON.stringify(formData), // PERBAIKAN BUG: Gunakan formData yang memiliki state lengkap sebagai Snapshot
                              pendingRevisionId: newRevision.id, // Penanda revisi yang sedang berjalan
                              revisionHistory: updatedHistory
                          });
                          
                          setFormData(prev => {
                              const newData = { ...prev, revisionHistory: updatedHistory };
                              delete newData.unlockPin; // Hapus juga dari state memori lokal
                              return newData;
                          });
                          setIsFinalVerified(false);
                          setUnlockPinFromDb(null);
                          setShowUnlockModal(false);
                          setPinInput('');
                          setRevisionReason('');
                          showToast("✅ Kunci form berhasil dibuka! Sistem siap melacak perubahan Anda.");
                      } else {
                          setPinInput(''); // Otomatis mengosongkan kotak input agar klien tidak bingung
                          showToast("❌ PIN yang dimasukkan salah atau sudah hangus (Sekali Pakai).");
                      }
                  } else {
                      showToast("❌ Data form tidak ditemukan.");
                  }
              } catch (error) {
                  console.error(error);
                  showToast("❌ Gagal memproses permintaan (Cek koneksi internet).");
              }
          };
          
          const handlePinDigitChange = (index, value) => {
              if (value && !/^[0-9]$/.test(value)) return; // Hanya izinkan angka
              let currentPin = pinInput.split('');
              currentPin[index] = value;
              setPinInput(currentPin.join(''));
              
              // Pindah kursor otomatis ke kotak selanjutnya
              if (value && index < 5) {
                  const nextEl = document.getElementById(`pin-${index + 1}`);
                  if (nextEl) nextEl.focus();
              }
          };

          const handlePinKeyDown = (index, e) => {
              // Pindah kursor otomatis mundur jika menekan backspace saat kotak kosong
              if (e.key === 'Backspace' && !pinInput[index] && index > 0) {
                  const prevEl = document.getElementById(`pin-${index - 1}`);
                  if (prevEl) prevEl.focus();
              }
          };

          const handlePinPaste = (e) => {
              e.preventDefault();
              const pasted = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
              if (pasted) {
                  setPinInput(pasted);
                  const nextIndex = Math.min(pasted.length, 5);
                  const nextEl = document.getElementById(`pin-${nextIndex === 6 ? 5 : nextIndex}`);
                  if (nextEl) nextEl.focus();
              }
          };

          const handleExportPDF = (type = 'main') => {
            setExportType(type);
            setToastMessage("Menyiapkan format cetak... Silakan pilih 'Save as PDF' di dialog print browser.");
            
            // Tunggu UI render ke mode export

                // Kembalikan ke mode normal setelah dialog tertutup
                setTimeout(() => {

          const pagesConfig = [
            { id: 1, name: 'Team', special: false }, { id: 2, name: 'Features', special: false },
            { id: 3, name: 'Timeline', special: false }, { id: 4, name: 'Users', special: false },
            { id: 5, name: 'WhatsApp', special: false }, { id: 17, name: 'WA Flow', special: false }, 
            { id: 6, name: 'Channel', special: false }, { id: 19, name: 'E-Commerce', special: false },

            { id: 9, name: 'Contact', special: false }, { id: 10, name: 'Company', special: false },
            { id: 11, name: 'Deals', special: false }, { id: 12, name: 'Ticket', special: false },
            { id: 13, name: 'Task', special: false }, { id: 14, name: 'Product', special: false },
            { id: 15, name: 'Call Center', special: false }, { id: 18, name: 'Revision', special: false }, { id: 16, name: 'Sign Off', special: true }
          ];

          // Filter navigasi & halaman secara dinamis berdasarkan checklist "Unlock"
          const getDynamicPages = () => {
             const isUnlocked = (moduleName) => {
                 const feature = formData.features.find(f => f.module === moduleName);
                 return feature ? feature.unlock : false;
             };

             const hasTicket = isUnlocked('Ticket Management');
             const hasDeal = isUnlocked('Deal Management');

             const corePages = pagesConfig.filter(page => {
                 switch(page.id) {
                     case 7: return true; // Chatbot selalu dimunculkan
                     case 8: return hasDeal || hasTicket; // Pipeline (muncul jika Deal ATAU Ticket aktif)
                     case 11: return hasDeal; // Deals
                     case 12: return hasTicket; // Ticket
                     case 14: return hasDeal; // Product (Mengekor ke Deal Management)
                     // Modul General (Channel, Contact, Company, Task) selalu dimunculkan
                     case 6: return true; // Channel
                     case 19: return true; // E-Commerce
                     case 9: return true; // Contact
                     case 10: return true; // Company
                     case 13: return true; // Task
                     case 17: return true; // WA Flow
                     case 18: return formData.revisionHistory && formData.revisionHistory.length > 0; // Halaman Revisi (Tampil jika ada riwayat)
                     default: return true; // Halaman inti, WA, & Call Center selalu muncul
                 }
             });
             
             // Sisipkan halaman custom yang statusnya Aktif
             const activeCustomPages = (masterData.customPages || [])
                 .filter(p => p.isActive)
                 .map(p => ({ id: p.id, name: p.title, special: false, isCustom: true }));
                 
             const pagesBeforeSignOff = corePages.filter(p => p.id !== 16);
             const signOffPage = corePages.find(p => p.id === 16);
             
             return [...pagesBeforeSignOff, ...activeCustomPages, signOffPage];
          };

          const dynamicPages = getDynamicPages();
          const navItems = dynamicPages.map((p, idx) => ({ ...p, displayId: idx + 1 }));
          const currentIndex = navItems.findIndex(p => p.id === currentPage);
          const safeCurrentPage = currentIndex !== -1 ? currentPage : navItems[0].id;

          const isPageActive = (id) => navItems.some(p => p.id === id);
          const getNextPageId = (id) => {
            const idx = navItems.findIndex(p => p.id === id);
            return idx !== -1 && idx < navItems.length - 1 ? navItems[idx + 1].id : id;
          };
          const getPrevPageId = (id) => {
            const idx = navItems.findIndex(p => p.id === id);
            return idx > 0 ? navItems[idx - 1].id : id;
          };
          
          const handlePageNavigation = (targetPageId) => {
             // Cek apakah menuju halaman 16 (Sign Off) tapi belum semua tervalidasi
             if (targetPageId === 16) {
                 const currentDynamic = getDynamicPages();
                 const unval = currentDynamic.filter(p => p.id !== 16 && !validatedPages[p.id]);
                 if (unval.length > 0) {
                     showToast("⚠️ Halaman Sign Off terkunci! Harap Tandai Selesai semua halaman sebelumnya.");
                     return;
                 }
             }

             setCurrentPage(targetPageId);
             
             setTimeout(() => {
                const navContainer = document.getElementById('nav-container');
                const activeBtn = document.getElementById(`nav-btn-${targetPageId}`);
                if (navContainer && activeBtn) {
                   const scrollPos = activeBtn.offsetLeft - (navContainer.offsetWidth / 2) + (activeBtn.offsetWidth / 2);
                   navContainer.scrollTo({ left: scrollPos, behavior: 'smooth' });
                }
             }, 100);
          };

          const handleSkipToggle = (moduleKey, pageId) => {
             const willBeSkipped = !formData.skippedModules[moduleKey];
             const newFormData = {
                ...formData,
                skippedModules: {
                   ...formData.skippedModules,
                   [moduleKey]: willBeSkipped
                }
             };
             setFormData(newFormData);
             
             let newValidatedPages = validatedPages;
             if (pageId) {
                 // Otomatis menvalidasi halaman jika modul di skip. Jika tidak di-skip, minta validasi ulang.
                 newValidatedPages = { ...validatedPages, [pageId]: willBeSkipped };
                 setValidatedPages(newValidatedPages);
             }
             
             // Trigger auto-save secara background saat opsi skip diubah
             handleSaveDraft(false, true, newValidatedPages, newFormData);
          };

          const handleSysTypeToggle = (type) => {
             setFormData(prev => {
                const current = Array.isArray(prev.systemUsageType) ? prev.systemUsageType : [];
                if (current.includes(type)) {
                   return { ...prev, systemUsageType: current.filter(t => t !== type) };
                } else {
                   return { ...prev, systemUsageType: [...current, type] };
                }
             });
          };

          // Modifikasi handleRootChange untuk kapitalisasi
          const handleRootChange = (e) => { 
             const name = e.target.name;
             let value = e.target.value;
             if (name === 'clientName') value = value.toUpperCase();
             setFormData(prev => ({ ...prev, [name]: value })); 
          };
          
          // Modifikasi handleNestedChange untuk kapitalisasi beberapa field spesifik
          const handleNestedChange = (section, field, value) => { 
             let finalValue = value;
             if (section === 'teamStructure' && (field.includes('Name') || field.includes('Role'))) {
                 finalValue = capitalizeWords(value);
             }
             setFormData(prev => ({...prev, [section]: { ...prev[section], [field]: finalValue }})); 
          };
          
          const handlePackageChange = (selectedPackageName) => {
             setFormData(prev => {
                const updatedGeneralInfo = { ...prev.generalInfo, package: selectedPackageName };
                
                const selectedPkg = masterData.packages.find(p => p.name === selectedPackageName);
                let updatedFeatures = prev.features;
                
                if (selectedPkg) {
                    const packageFeatures = Array.isArray(selectedPkg.defaultFeatures) ? selectedPkg.defaultFeatures : [];
                    
                    if (packageFeatures.length > 0) {
                        updatedFeatures = prev.features.map(feature => ({
                            ...feature,
                            unlock: packageFeatures.includes(feature.module)
                        }));
                    } else {
                        updatedFeatures = prev.features.map(feature => ({
                            ...feature,
                            unlock: false
                        }));
                    }
                }
                
                return { ...prev, generalInfo: updatedGeneralInfo, features: updatedFeatures };
             });
          };

          const handleSharedFbbmChange = (value) => { setFormData(prev => ({ ...prev, useCases: { ...prev.useCases, fbbmId: value }, whatsappDetails: { ...prev.whatsappDetails, fbbmId: value } })); };
          const handleFeatureChange = (index, field, value) => { const newFeatures = [...formData.features]; newFeatures[index] = { ...newFeatures[index], [field]: value }; setFormData(prev => ({ ...prev, features: newFeatures })); };
          
          // Modifikasi user row change untuk kapitalisasi
          const handleUserRowChange = (index, field, value) => {
            let finalValue = value;
            if (['firstName', 'lastName', 'division'].includes(field)) finalValue = capitalizeWords(value);
            const updatedUsers = [...formData.registeredUsers]; updatedUsers[index] = { ...updatedUsers[index], [field]: finalValue };
            setFormData(prev => ({ ...prev, registeredUsers: updatedUsers }));
          };
          const handleAddUserRow = () => { setFormData(prev => ({ ...prev, registeredUsers: [...prev.registeredUsers, { firstName: '', lastName: '', email: '', phone: '', division: '', roleOmni: '', roleCrm: '', teamCrm: '' }] })); };
          const handleRemoveUserRow = (index) => { setFormData(prev => { const updatedUsers = [...prev.registeredUsers]; updatedUsers.splice(index, 1); return { ...prev, registeredUsers: updatedUsers }; }); };

          // Modifikasi crm user row change untuk kapitalisasi
          const handleCrmUserRowChange = (index, field, value) => {
            let finalValue = value;
            if (['firstName', 'lastName', 'division'].includes(field)) finalValue = capitalizeWords(value);
            const updatedUsers = [...formData.crmUsers]; updatedUsers[index] = { ...updatedUsers[index], [field]: finalValue };
            setFormData(prev => ({ ...prev, crmUsers: updatedUsers }));
          };
          const handleAddCrmUserRow = () => { setFormData(prev => ({ ...prev, crmUsers: [...prev.crmUsers, { firstName: '', lastName: '', email: '', phone: '', division: '', roleCrm: '', teamCrm: '' }] })); };
          const handleRemoveCrmUserRow = (index) => { setFormData(prev => { const updatedUsers = [...prev.crmUsers]; updatedUsers.splice(index, 1); return { ...prev, crmUsers: updatedUsers }; }); };
          const handleSyncFromOmni = () => {
             setFormData(prev => {
                const validOmni = prev.registeredUsers.filter(u => u.firstName || u.email);
                if (validOmni.length === 0) return prev;
                const newCrm = validOmni.map(u => ({ ...u, roleCrm: '', teamCrm: '' }));
                return { ...prev, crmUsers: newCrm };
             });
             showToast("✅ Berhasil menyalin pengguna dari Omnichannel!");
          };

          // Modifikasi call center user change untuk kapitalisasi
          const handleCallCenterUserChange = (index, field, value) => {
            let finalValue = value;
            if (['firstName', 'lastName', 'division'].includes(field)) finalValue = capitalizeWords(value);
            const updated = [...formData.callCenterUsers]; updated[index] = { ...updated[index], [field]: finalValue };
            setFormData(prev => ({ ...prev, callCenterUsers: updated }));
          };
          const handleAddCallCenterUserRow = () => { setFormData(prev => ({ ...prev, callCenterUsers: [...prev.callCenterUsers, { firstName: '', lastName: '', email: '', phone: '', division: '', role: '' }] })); };
          const handleRemoveCallCenterUserRow = (index) => { setFormData(prev => { const updated = [...prev.callCenterUsers]; updated.splice(index, 1); return { ...prev, callCenterUsers: updated }; }); };

          const getSelectedPackageMaxFaq = () => {
             const selectedPkgName = formData.generalInfo.package;
             const pkg = masterData.packages.find(p => p.name === selectedPkgName);
             return pkg && pkg.maxFaq > 0 ? pkg.maxFaq : null; 
          };

          const countTotalFaq = (flowNode) => {
             let count = 0;
             if (flowNode.children) {
                count += flowNode.children.length;
                flowNode.children.forEach(child => {
                   count += countTotalFaq(child);
                });
             }
             return count;
          };

          const getChatbotDepth = (node) => {
              if (!node || !node.children || node.children.length === 0) return 1;
              return 1 + Math.max(...node.children.map(getChatbotDepth));
          };

          const getChatbotLeaves = (node) => {
              if (!node || !node.children || node.children.length === 0) return 1;
              return node.children.reduce((sum, child) => sum + getChatbotLeaves(child), 0);
          };

          const buildChatbotTableRows = (cbIndex, node, path, maxDepth, level = 0) => {
              const rows = [];
              const rowSpan = getChatbotLeaves(node);
              const isRoot = path.length === 0;
              const currentCells = [];
              
              // 1. Kolom User Input (Menggunakan inline style murni untuk menghindari bug html2canvas)
              currentCells.push(
                  <td key={`ui-${node.id}`} rowSpan={rowSpan} style={{ border: '1px solid #111827', padding: '8px', verticalAlign: 'top', minWidth: '150px', backgroundColor: isExporting ? '#ffffff' : '#fff7ed' }}>
                      {isRoot ? (
                          <div style={{ fontWeight: 'bold', fontSize: '12px', fontStyle: 'italic', color: isExporting ? '#111827' : '#374151' }}>Free Text</div>
                      ) : (
                          isExporting ? (
                              <div style={{ maxWidth: '180px', fontSize: '12px', fontWeight: 'bold', textAlign: 'center', marginTop: '8px', color: '#111827', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}>{node.trigger || '-'}</div>
                          ) : (
                              <div className="flex flex-col h-full">
                                  <label className="text-[10px] font-bold text-gray-500 mb-1">User Input (Jika Ketik):</label>
                                  <input type="text" value={node.trigger} onChange={(e) => updateChatbotNode(cbIndex, path, 'trigger', e.target.value)} className="w-full bg-white border border-gray-300 rounded px-2 py-1.5 text-xs outline-none focus:border-blue-500 font-bold" placeholder="Cth: 1"/>
                              </div>
                          )
                      )}
                  </td>
              );

              // 2. Kolom Bot Response
              const inputType = node.expectedInputType || 'button';
              const childCount = node.children ? node.children.length : 0;
              let canAdd = true; let limitMsg = '';
              const packageMaxFaq = getSelectedPackageMaxFaq();
              const currentTotalFaq = formData.chatbots.reduce((sum, cb) => sum + countTotalFaq(cb.flow), 0);

              if (inputType === 'button' && childCount >= 3) { canAdd = false; limitMsg = 'Maks 3 Opsi'; } 
              else if (inputType === 'list' && childCount >= 10) { canAdd = false; limitMsg = 'Maks 10 Opsi'; }
              else if (packageMaxFaq !== null && currentTotalFaq >= packageMaxFaq) { canAdd = false; limitMsg = `Maks ${packageMaxFaq} FAQ`; }

              currentCells.push(
                  <td key={`br-${node.id}`} rowSpan={rowSpan} style={{ border: '1px solid #111827', padding: '8px', verticalAlign: 'top', minWidth: '220px', backgroundColor: isExporting ? '#ffffff' : '#f0fdf4' }}>
                      {isExporting ? (
                          <div style={{ maxWidth: '280px', fontSize: '11px', whiteSpace: 'pre-wrap', wordBreak: 'break-word', color: '#111827' }}>{node.message || '-'}</div>
                      ) : (
                          <div className="flex flex-col gap-2 h-full">
                              <div className="flex-1">
                                  <label className="text-[10px] font-bold text-gray-500 mb-1 block">Bot Response:</label>
                                  <textarea value={node.message} onChange={(e) => updateChatbotNode(cbIndex, path, 'message', e.target.value)} rows="3" className="w-full border border-gray-300 rounded px-2 py-1.5 text-[11px] outline-none focus:border-blue-500 resize-none bg-white" placeholder="Tulis respon bot disini..."></textarea>
                              </div>
                              <div className="bg-white p-1.5 rounded border border-gray-200 mt-2 shadow-sm">
                                  <label className="text-[9px] font-bold text-gray-500 block mb-0.5">TIPE INPUT SELANJUTNYA:</label>
                                  <select value={inputType} onChange={(e) => updateChatbotNode(cbIndex, path, 'expectedInputType', e.target.value)} className="w-full bg-transparent border-none text-[11px] outline-none font-bold cursor-pointer text-blue-700">
                                      <option value="free_text">Free Text / Isi Form</option><option value="button">Button Menu</option><option value="list">List Menu</option>
                                  </select>
                              </div>
                              <div className="flex justify-between items-center mt-2 border-t border-gray-200 pt-2">
                                  {canAdd ? (
                                      <button onClick={() => addChatbotChild(cbIndex, path)} className="text-blue-700 bg-blue-100 hover:bg-blue-200 px-2 py-1 rounded text-[10px] font-bold shadow-sm transition-colors">+ Tambah Opsi</button>
                                  ) : (
                                      <span className="text-[9px] font-bold text-red-600 bg-red-100 px-2 py-1 rounded border border-red-200">{limitMsg}</span>
                                  )}
                                  {!isRoot && (
                                      <button onClick={() => removeChatbotNode(cbIndex, path)} className="text-red-600 bg-red-100 hover:bg-red-200 px-2 py-1 rounded text-[10px] font-bold shadow-sm transition-colors">Hapus</button>
                                  )}
                              </div>
                          </div>
                      )}
                  </td>
              );

              // 3. Padding Sel Kosong & Final Rules
              if (!node.children || node.children.length === 0) {
                  const paddingCols = (maxDepth - level - 1) * 2;
                  for(let i=0; i<paddingCols; i++) {
                      currentCells.push(<td key={`pad-${node.id}-${i}`} style={{ border: '1px solid #111827', backgroundColor: '#f3f4f6' }}></td>);
                  }
                  currentCells.push(
                      <td key={`fr-${node.id}`} style={{ border: '1px solid #111827', padding: '8px', verticalAlign: 'top', minWidth: '200px', backgroundColor: isExporting ? '#ffffff' : 'transparent' }}>
                          {isExporting ? (
                              <div style={{ maxWidth: '220px', fontSize: '11px', fontStyle: 'italic', whiteSpace: 'pre-wrap', wordBreak: 'break-word', color: '#111827' }}>{node.finalRule || '-'}</div>
                          ) : (
                              <Fragment>
                                <label className="text-[10px] font-bold text-gray-500 mb-1 block">Aturan Akhir:</label>
                                <textarea value={node.finalRule || ''} onChange={(e) => updateChatbotNode(cbIndex, path, 'finalRule', e.target.value)} rows="4" className="w-full border border-gray-300 rounded px-2 py-1.5 outline-none text-[11px] focus:border-blue-500 bg-gray-50 resize-none italic" placeholder="Harap tentukan aturan akhir, seperti Assign to Agent, Resolved, atau kembali ke General Rules..."></textarea>
                              </Fragment>
                          )}
                      </td>
                  );
                  rows.push(currentCells);
              } else {
                  // Rekursi untuk Anak Cabang
                  node.children.forEach((child, idx) => {
                      const childRows = buildChatbotTableRows(cbIndex, child, [...path, idx], maxDepth, level + 1);
                      if (idx === 0) {
                          // Gabungkan sel Parent dengan Baris Pertama Anak
                          rows.push([...currentCells, ...childRows[0]]);
                          // Masukkan sisa baris dari anak pertama
                          for (let i = 1; i < childRows.length; i++) {
                              rows.push(childRows[i]);
                          }
                      } else {
                          // Tambahkan baris anak lainnya langsung
                          rows.push(...childRows);
                      }
                  });
              }
              return rows;
          };

          const handleSimpleMatrixChange = (index, field, value) => { const updated = [...formData.crmSimpleMatrix]; updated[index] = { ...updated[index], [field]: value }; setFormData(prev => ({ ...prev, crmSimpleMatrix: updated })); };
          const handleAdvancedMatrixChange = (index, field, value) => { const updated = [...formData.crmAdvancedMatrix]; updated[index] = { ...updated[index], [field]: value }; setFormData(prev => ({ ...prev, crmAdvancedMatrix: updated })); };
          const handleChannelChange = (index, field, value) => { const updated = [...formData.channels]; updated[index] = { ...updated[index], [field]: value }; setFormData(prev => ({ ...prev, channels: updated })); };
          const handleEcommerceChange = (index, field, value) => { const updated = [...formData.ecommerce]; updated[index] = { ...updated[index], [field]: value }; setFormData(prev => ({ ...prev, ecommerce: updated })); };

          const handleWaFlowScreenChange = (sIndex, field, value) => { 
              const updated = [...formData.waFlow]; 
              updated[sIndex] = { ...updated[sIndex], [field]: value }; 
              setFormData(prev => ({ ...prev, waFlow: updated })); 
          };
          
          const handleWaFlowComponentChange = (sIndex, cIndex, field, value) => { 
              const updated = [...formData.waFlow]; 
              updated[sIndex].components[cIndex] = { ...updated[sIndex].components[cIndex], [field]: value }; 
              setFormData(prev => ({ ...prev, waFlow: updated })); 
          };
          
          const addWaFlowComponent = (sIndex) => { 
              const updated = [...formData.waFlow]; 
              updated[sIndex].components.push({ id: Date.now().toString(), name: '', type: 'Text: Short Answer', content: '', crmModule: '', crmField: '' }); 
              setFormData(prev => ({ ...prev, waFlow: updated })); 
          };
          
          const removeWaFlowComponent = (sIndex, cIndex) => { 
              const updated = [...formData.waFlow]; 
              updated[sIndex].components.splice(cIndex, 1); 
              setFormData(prev => ({ ...prev, waFlow: updated })); 
          };
          
          const addWaFlowScreen = () => { 
              setFormData(prev => ({ 
                  ...prev, 
                  waFlow: [...prev.waFlow, { 
                      id: Date.now().toString(), 
                      screenName: '', 
                      buttonText: 'Continue',
                      components: [
                          { id: Date.now().toString() + 'c1', name: '', type: 'Text: Short Answer', content: '', crmModule: '', crmField: '' }
                      ] 
                  }] 
              })); 
          };
          
          const removeWaFlowScreen = (sIndex) => { 
              setFormData(prev => { 
                  const updated = [...prev.waFlow]; 
                  updated.splice(sIndex, 1); 
                  return { ...prev, waFlow: updated }; 
              }); 
          };

          const handleChatbotGeneralChange = (cbIndex, field, value) => {
              setFormData(prev => {
                  const updated = [...prev.chatbots];
                  updated[cbIndex] = { ...updated[cbIndex], generalRules: { ...updated[cbIndex].generalRules, [field]: value } };
                  return { ...prev, chatbots: updated };
              });
          };

          const handleChatbotNameChange = (cbIndex, value) => {
              setFormData(prev => {
                  const updated = [...prev.chatbots];
                  updated[cbIndex] = { ...updated[cbIndex], name: value };
                  return { ...prev, chatbots: updated };
              });
          };

          const handleAddChatbot = () => {
              setFormData(prev => ({
                  ...prev,
                  chatbots: [...prev.chatbots, {
                      id: Date.now().toString(),
                      name: `Chatbot ${prev.chatbots.length + 1}`,
                      generalRules: { operatingHours: '', idleRules: '', idleMessage: '', wrongAnswer: '' },
                      flow: { id: 'root', trigger: 'Free Text', message: '', expectedInputType: 'button', finalRule: '', children: [] }
                  }]
              }));
              setActiveChatbotIndex(formData.chatbots ? formData.chatbots.length : 0);
          };

          const handleRemoveChatbot = (cbIndex) => {
              if (formData.chatbots.length <= 1) return; // Prevent deleting the last one
              setFormData(prev => {
                  const updated = [...prev.chatbots];
                  updated.splice(cbIndex, 1);
                  return { ...prev, chatbots: updated };
              });
              setActiveChatbotIndex(0);
          };

          const updateChatbotNode = (cbIndex, path, field, value) => {
            setFormData(prev => {
              const newChatbots = JSON.parse(JSON.stringify(prev.chatbots));
              let current = newChatbots[cbIndex].flow;
              for (let i = 0; i < path.length; i++) current = current.children[path[i]];
              current[field] = value; return { ...prev, chatbots: newChatbots };
            });
          };
          
          const addChatbotChild = (cbIndex, path) => {
            setFormData(prev => {
              const newChatbots = JSON.parse(JSON.stringify(prev.chatbots));
              let current = newChatbots[cbIndex].flow;
              for (let i = 0; i < path.length; i++) current = current.children[path[i]];
              current.children.push({ id: Date.now().toString(), trigger: '', message: '', expectedInputType: 'button', finalRule: '', children: [] });
              return { ...prev, chatbots: newChatbots };
            });
          };

          const removeChatbotNode = (cbIndex, path) => {
            setFormData(prev => {
              const newChatbots = JSON.parse(JSON.stringify(prev.chatbots));
              if(path.length === 0) return prev; 
              let parent = newChatbots[cbIndex].flow; 
              for (let i = 0; i < path.length - 1; i++) parent = parent.children[path[i]];
              parent.children.splice(path[path.length - 1], 1); return { ...prev, chatbots: newChatbots };
            });
          };

          const renderChatbotNode = (cbIndex, node, path = []) => {
            const isRoot = path.length === 0; const inputType = node.expectedInputType || 'button';
            const childCount = node.children ? node.children.length : 0;
            let canAdd = true; let limitMsg = '';
            
            const maxFaq = getSelectedPackageMaxFaq();
            const currentTotalFaq = formData.chatbots.reduce((sum, cb) => sum + countTotalFaq(cb.flow), 0);

            if (inputType === 'button' && childCount >= 3) { canAdd = false; limitMsg = 'Batas Maks. 3 Opsi'; } 
            else if (inputType === 'list' && childCount >= 10) { canAdd = false; limitMsg = 'Batas Maks. 10 Opsi'; }
            else if (maxFaq !== null && currentTotalFaq >= maxFaq) { canAdd = false; limitMsg = `Batas Paket: Maks ${maxFaq} FAQ`; }

            // Gunakan <div> untuk format export PDF agar valid dan tidak bertabrakan dengan CSS list tree
            const NodeWrapper = isExporting ? 'div' : 'li';

            return (
              <NodeWrapper key={node.id} className={isExporting ? "relative mt-3" : ""}>
                <div className={`${isExporting ? 'block w-[95%] max-w-[340px] mb-2 avoid-break' : 'mx-auto w-[260px] sm:w-[300px] inline-block'} bg-white border ${isRoot ? 'border-blue-500 shadow-md ring-2 ring-blue-100' : 'border-gray-300 shadow-sm'} rounded-xl p-3 text-left relative z-10 transition-shadow`}>
                  {isRoot && <div className="bg-blue-100 text-blue-800 text-[10px] uppercase font-bold px-2 py-1 rounded inline-block mb-2">TITIK AWAL (START POINT)</div>}
                  {!isRoot && (
                    <div className="mb-2 bg-emerald-50 p-2 rounded border border-emerald-200">
                       <label className="block text-[10px] font-bold text-gray-600 uppercase mb-1">Jika Customer Mengetik (User Input):</label>
                       <input type="text" value={node.trigger} onChange={(e) => updateChatbotNode(cbIndex, path, 'trigger', e.target.value)} className="w-full bg-transparent border-b border-emerald-400 px-1 py-0.5 text-sm outline-none font-bold text-emerald-800" placeholder="Cth: 1, atau Halo..."/>
                    </div>
                  )}

                                       <td className="border border-black p-0"><input type="text" value={formData.callCenter.config.customHoliday} onChange={(e) => handleCallCenterConfigChange('customHoliday', e.target.value)} className="w-full h-full min-h-[30px] text-center bg-transparent outline-none"/></td>
                                       <td className="border border-black p-1.5 text-left bg-gray-200 text-gray-700">Diberikan list tanggal custom holiday (Bisa di configure dari tim DSI)</td>
                                    </tr>
                                    <tr className="bg-white avoid-break-row">
                                       <td className="border border-black p-1.5 text-left px-3 align-top">Ring Mode</td>
                                       <td className="border border-black p-0 relative align-top">
                                          <select value={formData.callCenter.config.ringMode} onChange={(e) => handleCallCenterConfigChange('ringMode', e.target.value)} className={`w-full h-full min-h-[30px] text-center bg-transparent outline-none cursor-pointer font-medium pt-1 ${isExporting ? 'appearance-auto' : 'appearance-none'}`}>
                                             <option value="Round Robin">Round Robin</option><option value="Ring All">Ring All</option><option value="Proficiency Level">Proficiency Level</option><option value="Sticky Agent">Sticky Agent</option>
                                          </select>
                                          {!isExporting && <div className="pointer-events-none absolute top-2 right-2 flex items-center text-gray-500 text-[10px]">▼</div>}
                                       </td>
                                       <td className="border border-black p-3 text-left text-[11px] leading-relaxed bg-gray-200 text-gray-700">
                                          <strong>Round Robin:</strong> distribute calls evenly among the team. The queue has multiple agents and incoming calls will route to them sequentially. Just add agents in the order that you want them to ring. If a call is received by the first agent in the queue, and goes unanswered for a pre-set amount of time, the call will go to the second agent, then the third.<br/>
                                          <strong>Ring All:</strong> assign the incoming call to all available agents.<br/>
                                          <strong>Proficiency Level:</strong> The incoming call will be assigned to the agent who has the highest proficiency. For example, agents 116, 150 and 110 have proficiency 1, 3, and 2 respectively. The incoming call will be assigned to agent 150 first, then go to agent 110 and 116.<br/>
                                          <strong>Sticky Agent:</strong> if a caller calls in for the first time, the system will do a round robin among the available agents to pick up the call as usual. From the second time onwards, the call will be transferred to the assigned user based on the number of dial times set. If the agent misses the call or is unable to answer, the caller can choose whether they want to leave a voicemail, trigger a callback or be connected to another agent.
                                       </td>
                                    </tr>
                                 </tbody>
                              </table>

                                  <div className="absolute top-[100px] left-[15px] w-4 border-t border-black">
                                     <div className="absolute -right-1 -top-1 w-2 h-2 border-t border-r border-black transform rotate-45"></div>
                                  </div>
                               </div>
                               <div className="flex flex-col gap-4">
                                  <div className="border border-black bg-[#cfe2f3] px-4 py-2 rounded-lg shadow-sm text-center">Assign ke<br/>Agent 1</div>
                                  <div className="border border-black bg-[#cfe2f3] px-4 py-2 rounded-lg shadow-sm text-center">Assign ke<br/>Agent 2</div>
                                  <div className="border border-black bg-[#cfe2f3] px-4 py-2 rounded-lg shadow-sm text-center">Assign ke<br/>Agent 3</div>
                               </div>
                           </div>

                         </div>
                       </div>
                       <ValidationFooter pageId={15} />
                    </div>
                  </div>
                  );
                })()}

              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<URDForm />);
    </script>
